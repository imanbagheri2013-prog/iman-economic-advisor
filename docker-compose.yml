services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      IEA_REPORT_PATH: /data/health_report.json
      IEA_API_HOST: 0.0.0.0
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - iea-runtime:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "iea.production_worker"]
    environment:
      IEA_RUNTIME_DIR: /data
      IEA_SCHEDULER_INTERVAL_SECONDS: ${IEA_SCHEDULER_INTERVAL_SECONDS:-900}
    volumes:
      - iea-runtime:/data
    restart: unless-stopped

volumes:
  iea-runtime:
