name: BLS Live Test

on:
  workflow_dispatch:

jobs:
  bls-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Test BLS connection
        run: |
          python - <<'PY'
          from iea.providers.bls import BLS

          provider = BLS()

          observations = provider.observations(
              "CUUR0000SA0",
              2026,
              2026,
          )

          if not observations:
              raise SystemExit(
                  "BLS returned no observations"
              )

          valid = [
              obs for obs in observations
              if obs.value is not None
          ]

          if not valid:
              raise SystemExit(
                  "BLS returned observations but no valid numeric values"
              )

          print(
              f"BLS connection successful: "
              f"{len(observations)} observations received"
          )
          print(
              f"Valid observations: {len(valid)}"
          )
          PY
