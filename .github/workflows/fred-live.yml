name: FRED Live Test

on:
  workflow_dispatch:

jobs:
  fred-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Test FRED connection
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from iea.providers.fred import FRED

          api_key = os.environ.get("FRED_API_KEY")

          if not api_key:
              raise SystemExit("FRED_API_KEY is not configured")

          provider = FRED(api_key=api_key)

          observations = provider.observations(
              "CPIAUCSL",
              limit=3,
          )

          if not observations:
              raise SystemExit("FRED returned no observations")

          print(f"FRED connection successful: {len(observations)} observations received")
          PY
