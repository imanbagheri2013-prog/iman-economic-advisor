name: IEA Scheduler

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Iran cash equities: Sat-Wed, 09:00-12:30 Tehran time.
    # Run around the session; Python session gating remains authoritative
    # for holidays, pre-open, close, and unexpected market closures.
    - cron: "30,45 8 * * 0-3,6"
      timezone: "Asia/Tehran"
    - cron: "*/15 9-11 * * 0-3,6"
      timezone: "Asia/Tehran"
    - cron: "0,15,30 12 * * 0-3,6"
      timezone: "Asia/Tehran"

permissions:
  actions: read
  contents: read

jobs:
  scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore latest valid Iran market state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          latest_run="$(gh api --method GET "repos/${GH_REPO}/actions/artifacts" -f name=iran-market-state -f per_page=1 --jq '.artifacts[0].workflow_run.id // empty')"
          if [ -n "$latest_run" ] && gh run download "$latest_run" --name iran-market-state --dir .; then
            echo "Restored newest Iran market state artifact from scheduler run $latest_run"
          else
            echo "No previous market state artifact available; scheduler will use a no-state fallback."
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Select Iran market universe
        env:
          IEA_MARKET_MIRROR_URL: "https://raw.githubusercontent.com/imanbagheri2013-prog/iman-economic-advisor/market-data/data/iran_market_live.json"
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          fallback = ["فولاد", "فملی", "شستا", "خودرو", "وبملت"]
          url = os.environ["IEA_MARKET_MIRROR_URL"]
          selected = fallback
          try:
              request = Request(url, headers={"Accept": "application/json", "User-Agent": "IEA-Scheduler/1.0"})
              with urlopen(request, timeout=15) as response:
                  payload = json.load(response)
              symbols = payload.get("symbols") if isinstance(payload, dict) else None
              mode = payload.get("universe_mode") if isinstance(payload, dict) else None
              count = int(payload.get("universe_count") or len(symbols or {})) if isinstance(payload, dict) else 0
              if mode == "FULL_MARKET" and isinstance(symbols, dict) and count >= 100 and count == len(symbols):
                  selected = sorted(str(symbol).strip() for symbol in symbols if str(symbol).strip())
                  print(f"Using FULL_MARKET universe: {len(selected)} symbols")
              else:
                  print(f"Full-market mirror not verified (mode={mode!r}, count={count}); using safe configured subset of {len(fallback)} symbols")
          except Exception as exc:
              print(f"Could not inspect market mirror ({type(exc).__name__}: {exc}); using safe configured subset of {len(fallback)} symbols")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("IEA_IR_SYMBOLS=" + ",".join(selected) + "\n")
          PY

      # A degraded market-data mirror is an expected health state while the
      # upstream is unavailable. The scheduler itself already emits NO_TRADE
      # and BLOCKED gates, so this step must not turn that into CI failure.
      - name: Run economic data scheduler
        id: run_scheduler
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_START_YEAR: "2021"
          BLS_END_YEAR: "2026"
          IEA_DB_PATH: "data/iea.sqlite3"
          IEA_CBI_DATA_URL: ${{ secrets.IEA_CBI_DATA_URL }}
          IEA_CAPITAL: ${{ vars.IEA_CAPITAL }}
          IEA_EQUITY_INPUT_PATH: "config/equity_input.json"
          IEA_EQUITY_SYMBOL: ${{ vars.IEA_EQUITY_SYMBOL }}
          IEA_EQUITY_PE_MULTIPLE: ${{ vars.IEA_EQUITY_PE_MULTIPLE }}
          IEA_SEC_USER_AGENT: ${{ vars.IEA_SEC_USER_AGENT }}
        run: python -m iea.scheduler

      - name: Upload scheduler report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduler-health-report
          path: health_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Validate market state before artifact upload
        id: validate-market-state
        if: steps.run_scheduler.outcome == 'success' && hashFiles('iran_market_state.json') != ''
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("iran_market_state.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          valid = (
              isinstance(data, dict)
              and data.get("market_region") == "IRAN"
              and data.get("data_mode") == "LIVE_MARKET"
              and data.get("stale") is False
              and isinstance(data.get("factors"), list)
              and bool(data.get("generated_at"))
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"valid={'true' if valid else 'false'}\n")
          print("Valid LIVE_MARKET state; artifact upload is allowed." if valid else "Current state is not a valid live snapshot; preserving the previous valid artifact.")
          PY

      - name: Upload latest valid Iran market state
        if: steps.run_scheduler.outcome == 'success' && steps.validate-market-state.outputs.valid == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: iran-market-state
          path: iran_market_state.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report degraded scheduler without failing the workflow
        if: steps.run_scheduler.outcome == 'failure'
        run: echo "::warning::Scheduler completed with degraded/blocked data health; the health report was preserved and no invalid live market state was published."
