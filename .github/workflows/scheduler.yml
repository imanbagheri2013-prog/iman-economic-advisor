name: IEA Scheduler

on:
workflow_dispatch:

jobs:
scheduler:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Python
  uses: actions/setup-python@v5
  with:
    python-version: "3.12"

- name: Install dependencies
  run: pip install -r requirements.txt

- name: Run Scheduler
  env:
    FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    BLS_START_YEAR: "2021"
    BLS_END_YEAR: "2026"
    IEA_DB_PATH: "data/iea.sqlite3"
  run: python -m iea.scheduler

