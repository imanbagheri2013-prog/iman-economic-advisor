name: IEA Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run economic data scheduler
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_START_YEAR: "2021"
          BLS_END_YEAR: "2026"
          IEA_DB_PATH: "data/iea.sqlite3"
        run: python -m iea.scheduler
