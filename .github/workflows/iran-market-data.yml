name: IEA Iran Market Data Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "scripts/publish_iran_market_data.py"
      - "scripts/publish_iran_market_full_xlsx.py"
      - "scripts/fetch_iran_market_via_proxy.py"
      - ".github/workflows/iran-market-data.yml"

permissions:
  contents: write

concurrency:
  group: iran-market-data
  cancel-in-progress: true

jobs:
  publish:
    # Do not depend on the custom self-hosted Iran runner. The workflow already
    # contains resilient public proxy fallbacks, so it can run on GitHub-hosted CI.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Check Iran TSETMC network reachability (informational)
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests
          urls = [
              "https://cdn.tsetmc.com/api/ClosingPrice/GetMarketWatch?market=0&withBestLimits=false&hEven=0&RefID=0",
              "https://old.tsetmc.com/tsev2/excel/MarketWatchPlus.aspx?d=0",
          ]
          for url in urls:
              try:
                  r = requests.get(url, timeout=20, headers={"User-Agent": "IEA/1.0"})
                  print(url, r.status_code, len(r.content))
              except Exception as exc:
                  print(url, type(exc).__name__, exc)
          PY

      - name: Restore last valid market mirror
        run: |
          set -e
          git fetch origin market-data
          mkdir -p data
          if git cat-file -e origin/market-data:data/iran_market_live.json 2>/dev/null; then
            git show origin/market-data:data/iran_market_live.json > data/iran_market_live.json
            echo "Restored previous valid market mirror as outage-safe baseline."
          else
            echo "No previous market mirror exists yet."
          fi

      - name: Fetch Full-Market from primary TSETMC sources
        id: primary_fetch
        continue-on-error: true
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Primary Full-Market fetch attempt ${attempt}/3"
            python scripts/publish_iran_market_full_xlsx.py
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "primary_ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Primary attempt ${attempt} failed with exit code ${rc}."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "primary_ok=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Fetch Full-Market through resilient proxy fallback
        id: proxy_fetch
        if: steps.primary_fetch.outputs.primary_ok != 'true'
        continue-on-error: true
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Proxy Full-Market fetch attempt ${attempt}/3"
            python scripts/fetch_iran_market_via_proxy.py
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "proxy_ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Proxy attempt ${attempt} failed with exit code ${rc}."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "proxy_ok=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Verify Full-Market mirror payload
        id: verify
        run: |
          set -e
          test -s data/iran_market_live.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path("data/iran_market_live.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          symbols = data.get("symbols") or {}
          mode = data.get("universe_mode")
          count = int(data.get("universe_count") or 0)
          generated = data.get("generated_at")

          if not isinstance(symbols, dict) or not symbols:
              raise SystemExit("market mirror contains no symbols")
          if mode != "FULL_MARKET":
              raise SystemExit(f"market mirror is not FULL_MARKET: {mode!r}")
          if count < 1000:
              raise SystemExit(f"Full-Market universe is implausibly small: {count}")
          if count != len(symbols):
              raise SystemExit(f"universe_count mismatch: metadata={count}, symbols={len(symbols)}")
          if not generated:
              raise SystemExit("generated_at is missing")
          ts = datetime.fromisoformat(generated.replace("Z", "+00:00"))
          age = (datetime.now(timezone.utc) - ts).total_seconds()
          if age < 0 or age > 1200:
              raise SystemExit(f"snapshot is stale: age_seconds={age:.1f}")

          missing = []
          for symbol, item in symbols.items():
              info = item.get("instrument_info") or {}
              if info.get("pClosing") is None or info.get("pDrCotVal") is None or info.get("priceYesterday") is None:
                  missing.append(symbol)
          if missing:
              preview = ", ".join(missing[:10])
              raise SystemExit(f"analysis-required price fields missing for {len(missing)} symbols: {preview}")

          print(f"Full-Market mirror valid: {count} symbols")
          print(f"Freshness: {age:.1f}s")
          print(f"Source: {data.get('source')}")
          PY
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Publish mirror branch
        if: steps.verify.outputs.verified == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "$RUNNER_TEMP/iran-market-mirror"
          cp data/iran_market_live.json "$RUNNER_TEMP/iran-market-mirror/iran_market_live.json"

          git reset --hard HEAD
          git clean -fd data
          git checkout -B market-data origin/market-data
          mkdir -p data
          cp "$RUNNER_TEMP/iran-market-mirror/iran_market_live.json" data/iran_market_live.json
          git add data/iran_market_live.json
          git commit -m "Update full Iran market data mirror" || echo "No data changes"
          git push origin HEAD:market-data --force

      - name: Fail when no valid Full-Market snapshot was produced
        if: steps.verify.outputs.verified != 'true'
        run: |
          echo "::error::No valid Full-Market snapshot was produced. Existing market-data mirror was not modified."
          exit 1

      # Final gate: green only after a real Full-Market payload is verified and publishable.
