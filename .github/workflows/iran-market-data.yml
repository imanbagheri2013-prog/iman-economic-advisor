name: IEA Iran Market Data Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "scripts/publish_iran_market_data.py"
      - ".github/workflows/iran-market-data.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Fetch full Iran market universe
        run: python scripts/publish_iran_market_data.py

      - name: Publish mirror branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin market-data || true
          git checkout -B market-data
          git add data/iran_market_live.json
          git commit -m "Update full Iran market data mirror" || echo "No data changes"
          git push origin HEAD:market-data --force
