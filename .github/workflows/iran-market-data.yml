name: IEA Iran Market Data Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "scripts/publish_iran_market_data.py"
      - "scripts/publish_iran_market_full_xlsx.py"
      - "scripts/fetch_iran_market_via_proxy.py"
      - ".github/workflows/iran-market-data.yml"

permissions:
  contents: write

concurrency:
  group: iran-market-data
  cancel-in-progress: true

jobs:
  publish:
    # GitHub-hosted runner avoids dependency on the custom self-hosted runner.
    # Primary access still uses the configured Iranian egress proxy, with a
    # resilient public-proxy fallback if primary TSETMC access fails.
    runs-on: [self-hosted, linux, x64, iran-tsetmc]
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Require Iranian egress proxy
        env:
          HTTPS_PROXY: ${{ secrets.IRAN_TSETMC_PROXY }}
          HTTP_PROXY: ${{ secrets.IRAN_TSETMC_PROXY }}
        run: |
          set -e
          if [ -z "${HTTPS_PROXY:-}" ]; then
            echo "::error::IRAN_TSETMC_PROXY is not configured. TSETMC blocks the current foreign/datacenter egress."
            exit 1
          fi
          echo "Iranian egress proxy is configured. Value is intentionally hidden."

      - name: Diagnose TSETMC access through proxy
        continue-on-error: true
        env:
          HTTPS_PROXY: ${{ secrets.IRAN_TSETMC_PROXY }}
          HTTP_PROXY: ${{ secrets.IRAN_TSETMC_PROXY }}
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, socket, requests
          print("# IEA TSETMC Network Diagnostic")
          print(f"Runner: {socket.gethostname()}")
          print(f"HTTP proxy configured: {bool(os.environ.get('HTTP_PROXY'))}")
          print(f"HTTPS proxy configured: {bool(os.environ.get('HTTPS_PROXY'))}")
          try:
              r = requests.get("https://api.ipify.org", timeout=10)
              print(f"Observed egress IP: {r.text.strip()}")
          except Exception as exc:
              print(f"Egress-IP check failed: {type(exc).__name__}: {exc}")
          try:
              r = requests.get(
                  "https://webgw.tse.ir/InstrumentProvider/api/v1/MarketWatch/MarketWatchCash/fa",
                  timeout=(8, 20),
                  headers={"User-Agent": "Mozilla/5.0"},
                  allow_redirects=True,
              )
              print(f"TSE web gateway HTTP {r.status_code}, bytes={len(r.content)}, final={r.url}")
          except Exception as exc:
              print(f"TSE web gateway access failed: {type(exc).__name__}: {exc}")
          PY

      - name: Restore last valid market mirror
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin market-data
          mkdir -p data
          if git cat-file -e origin/market-data:data/iran_market_live.json 2>/dev/null; then
            git show origin/market-data:data/iran_market_live.json > data/iran_market_live.json
            echo "Previous valid market mirror restored as outage-safe baseline."
          else
            echo "No previous market mirror exists yet; first successful fetch will create it."
          fi

      - name: Fetch Full-Market from TSETMC through Iranian proxy
        id: primary_fetch
        continue-on-error: true
        env:
          HTTPS_PROXY: ${{ secrets.IRAN_TSETMC_PROXY }}
          HTTP_PROXY: ${{ secrets.IRAN_TSETMC_PROXY }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Primary Full-Market fetch attempt ${attempt}/3"
            python scripts/publish_iran_market_full_xlsx.py
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "primary_ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Primary attempt ${attempt} failed with exit code ${rc}."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "primary_ok=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Fetch Full-Market through resilient public proxy fallback
        id: proxy_fetch
        if: steps.primary_fetch.outputs.primary_ok != 'true'
        continue-on-error: true
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Proxy Full-Market fetch attempt ${attempt}/3"
            python scripts/fetch_iran_market_via_proxy.py
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "proxy_ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Proxy attempt ${attempt} failed with exit code ${rc}."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "proxy_ok=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Verify Full-Market mirror payload
        id: verify
        run: |
          set -e
          test -s data/iran_market_live.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path("data/iran_market_live.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          symbols = data.get("symbols") or {}
          mode = data.get("universe_mode")
          count = int(data.get("universe_count") or 0)
          generated = data.get("generated_at")

          if not isinstance(symbols, dict) or not symbols:
              raise SystemExit("market mirror contains no symbols")
          if mode != "FULL_MARKET":
              raise SystemExit(f"market mirror is not FULL_MARKET: {mode!r}")
          if count < 1000:
              raise SystemExit(f"Full-Market universe is implausibly small: {count}")
          if count != len(symbols):
              raise SystemExit(f"universe_count mismatch: metadata={count}, symbols={len(symbols)}")
          if not generated:
              raise SystemExit("generated_at is missing")

          ts = datetime.fromisoformat(generated.replace("Z", "+00:00"))
          age = (datetime.now(timezone.utc) - ts).total_seconds()
          if age < 0 or age > 1200:
              raise SystemExit(f"snapshot is stale: age_seconds={age:.1f}")

          # Cash and ETF are expected to carry complete daily price fields.
          # Futures/options/debt instruments can legitimately omit one or more
          # spot-price fields, so they are validated separately.
          by_segment = {}
          for item in symbols.values():
              segment = (item.get("market") or {}).get("segment") or "unknown"
              by_segment.setdefault(segment, []).append(item)

          for segment in ("cash", "etf"):
              rows = by_segment.get(segment, [])
              if not rows:
                  raise SystemExit(f"required market segment is missing: {segment}")
              complete = 0
              for item in rows:
                  info = item.get("instrument_info") or {}
                  if (
                      info.get("pClosing") is not None
                      and info.get("pDrCotVal") is not None
                      and info.get("priceYesterday") is not None
                  ):
                      complete += 1
              ratio = complete / len(rows)
              if ratio < 0.95:
                  raise SystemExit(
                      f"{segment} price completeness too low: "
                      f"complete={complete}, total={len(rows)}, ratio={ratio:.1%}"
                  )
              print(f"{segment} price records: {complete}/{len(rows)} ({ratio:.1%})")

          segment_counts = {k: len(v) for k, v in by_segment.items()}
          print(f"Segment counts: {segment_counts}")
          print(f"Full-Market mirror valid: {count} symbols")
          print(f"Freshness: {age:.1f}s")
          print(f"Source: {data.get('source')}")
          PY
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Publish mirror branch
        if: steps.verify.outputs.verified == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "$RUNNER_TEMP/iran-market-mirror"
          cp data/iran_market_live.json "$RUNNER_TEMP/iran-market-mirror/iran_market_live.json"

          git reset --hard HEAD
          git clean -fd data
          git checkout -B market-data origin/market-data
          mkdir -p data
          cp "$RUNNER_TEMP/iran-market-mirror/iran_market_live.json" data/iran_market_live.json
          git add data/iran_market_live.json
          git commit -m "Update full Iran market data mirror" || echo "No data changes"
          git push origin HEAD:market-data --force

      - name: Fail when no valid Full-Market snapshot was produced
        if: steps.verify.outputs.verified != 'true'
        run: |
          echo "::error::No valid Full-Market snapshot was produced. Existing market-data mirror was not modified."
          exit 1
