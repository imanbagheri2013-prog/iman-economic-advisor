name: IEA Iran Market Data Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "scripts/publish_iran_market_data.py"
      - ".github/workflows/iran-market-data.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Restore last valid market mirror
        run: |
          set -e
          git fetch origin market-data
          mkdir -p data
          if git cat-file -e origin/market-data:data/iran_market_live.json 2>/dev/null; then
            git show origin/market-data:data/iran_market_live.json > data/iran_market_live.json
            echo "Restored previous valid market mirror as outage-safe baseline."
          else
            echo "No previous market mirror exists yet."
          fi

      - name: Harden market-data source access
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/publish_iran_market_data.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'CDN_MARKETWATCH_URL = "https://cdn.tsetmc.com/api/ClosingPrice/GetMarketWatch"',
              'CDN_MARKETWATCH_URL = "https://cdn.tsetmc.com/api/ClosingPrice/GetMarketWatch?market=0&paperTypes%5B0%5D=1&paperTypes%5B1%5D=2&paperTypes%5B2%5D=3&paperTypes%5B3%5D=4&paperTypes%5B4%5D=5&paperTypes%5B5%5D=6&paperTypes%5B6%5D=7&paperTypes%5B7%5D=8&paperTypes%5B8%5D=9&showTraded=false&withBestLimits=false&hEven=0&RefID=0"',
          )
          s = s.replace('timeout=(4, 10)', 'timeout=(15, 30)')
          s = s.replace('timeout=(4, 8)', 'timeout=(15, 30)')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Fetch full Iran market universe
        continue-on-error: true
        id: fetch_market
        run: |
          set +e
          last_status=1
          for attempt in 1 2 3; do
            echo "Iran market fetch attempt ${attempt}/3"
            if python scripts/publish_iran_market_data.py; then
              last_status=0
              break
            fi
            last_status=$?
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          if [ "$last_status" -ne 0 ]; then
            echo "::warning::Iran market upstreams were unavailable; preserving the last valid mirror. Data Health must treat this snapshot as stale."
          fi
          exit "$last_status"

      - name: Verify full-universe mirror payload
        run: |
          set -e
          test -s data/iran_market_live.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/iran_market_live.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          symbols = data.get("symbols") or {}
          mode = data.get("universe_mode")
          count = int(data.get("universe_count") or len(symbols))
          if not isinstance(symbols, dict) or not symbols:
              raise SystemExit("market mirror exists but contains no symbols")
          if mode != "FULL_MARKET":
              raise SystemExit(f"market mirror is not full-universe: universe_mode={mode!r}")
          if count < 100:
              raise SystemExit(f"market mirror universe is implausibly small: universe_count={count}")
          if count != len(symbols):
              raise SystemExit(f"market mirror universe_count mismatch: metadata={count}, symbols={len(symbols)}")
          print(f"Full-market mirror payload valid: {count} symbols")
          print(f"Generated at: {data.get('generated_at')}")
          print(f"Source: {data.get('source')}")
          PY

      - name: Publish mirror branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "$RUNNER_TEMP/iran-market-mirror"
          cp data/iran_market_live.json "$RUNNER_TEMP/iran-market-mirror/iran_market_live.json"

          git reset --hard HEAD
          git clean -fd data
          git checkout -B market-data origin/market-data

          mkdir -p data
          cp "$RUNNER_TEMP/iran-market-mirror/iran_market_live.json" data/iran_market_live.json
          git add data/iran_market_live.json
          git commit -m "Update full Iran market data mirror" || echo "No data changes"
          git push origin HEAD:market-data --force

      - name: Report upstream outage without failing mirror publication
        if: steps.fetch_market.outcome == 'failure'
        run: echo "::warning::Published the last valid Iran market mirror because upstream market sources timed out."
